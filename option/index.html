const $=id=>document.getElementById(id);
const NOPT=OPTS.filter(o=>!o.basic).length;
const num=k=>OPTS[k].basic?(OPTS[k].label||'기본'):String(OPTS.slice(0,k+1).filter(o=>!o.basic).length).padStart(2,'0');
const tagOf=k=>OPTS[k].basic?(OPTS[k].cat?'제트리프트 제품 카탈로그':'제트리프트 기본 기능'):'OPTION '+num(k)+' / '+NOPT;
const priceOf=o=>o.basic?'':(/\d/.test(o.price)?o.price+'원':o.price);
const chips=OPTS.map((o,k)=>{const b=document.createElement('button');b.type='button';
  b.innerHTML='<small>'+num(k)+'</small><span>'+(o.mname||o.name)+'</span>'+(o.fs?'<em>'+o.fs+'</em>':'');b.title=o.name;
  b.onclick=()=>show(k,true);if(!k||OPTS[k-1].grp!==o.grp){const h=document.createElement('div');h.className='grp';h.textContent=o.grp;$('chips').appendChild(h);}$('chips').appendChild(b);return b;});
const SHORT=["Z50 (50kg·진공)", "Z100 (95kg·호이스트)", "장비 이동", "진공모터", "박스", "포대", "2구 박스", "4구 그리퍼", "4구 판재", "틸팅", "하이라이즈", "사각 철통", "플라스틱박스", "마대", "마대 ver.2", "롤(원단)", "후크 고리", "에어그리퍼", "배터리 크램프", "스텐 원형 식깡", "마그네틱"];
const mchips=OPTS.map((o,k)=>{const b=document.createElement('button');b.type='button';b.textContent=SHORT[k];
  b.onclick=()=>show(k,true);$('mbar').appendChild(b);return b;});
let cur=0;
function show(k,play){
  cur=(k+OPTS.length)%OPTS.length;const o=OPTS[cur];
  $('pbox').style.aspectRatio=o.wide?'16/9':'';$('pbox').style.alignSelf=o.wide?'start':'';
  const catH=o.cat?'<div class="cat1"><a id="clink"><img id="cimg" alt=""></a><div class="cnav"><button type="button" id="cprev">‹ 이전 쪽</button><span id="cnum"></span><button type="button" id="cnext">다음 쪽 ›</button></div></div>':'';
  $('pbox').innerHTML=o.cat?catH:o.photo?'<img class="photo" src="'+o.photo+'" alt="'+o.name+' 사진">':(!o.mp4&&!o.id)?'<div class="novid"><b>'+o.name+'</b><span>'+(o.fit||'')+'</span><span>영상 준비 중</span></div>':o.mp4?'<video preload="metadata" src="'+o.mp4+'" poster="'+o.poster+'" controls playsinline'+(play?' autoplay':'')+'></video>'
    :'<iframe id="player" src="https://www.youtube-nocookie.com/embed/'+o.id+'?rel=0&mute=1&playsinline=1&enablejsapi=1'+(play?'&autoplay=1':'')+'" title="옵션 동영상" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
  $('yt').style.display=(o.mp4||o.cat||!o.id)?'none':'';
  $('pbox').classList.toggle('cat',!!o.cat);if(o.cat){let pg=0;const go=n=>{pg=Math.max(0,Math.min(o.cat.length-1,n));$('cimg').src=o.cat[pg];$('cimg').alt=o.name+' '+(pg+1)+'쪽';$('cnum').textContent=(pg+1)+' / '+o.cat.length;$('cprev').disabled=pg===0;$('cnext').disabled=pg===o.cat.length-1;};$('cprev').onclick=()=>go(pg-1);$('cnext').onclick=()=>go(pg+1);go(0);}document.querySelector('.stage').classList.toggle('catmode',!!o.cat);$('shot').style.display=o.img?'':'none';
  $('tag').textContent=tagOf(cur);
  $('name').textContent=o.name;
  $('price').textContent=priceOf(o);
  $('desc').textContent=o.desc;
  $('fit').textContent=o.fit?'사용 가능 모델 : '+o.fit:'';$('fit').style.display=o.fit?'':'none';
  $('shot').src=o.img;$('shot').alt=o.name+' 옵션 사진';
  $('yt').href='https://www.youtube.com/shorts/'+o.id;
  chips.forEach((c,i)=>c.classList.toggle('on',i===cur));
  mchips.forEach((c,i)=>c.classList.toggle('on',i===cur));
  const m=mchips[cur],bar=$('mbar');bar.scrollTo({left:m.offsetLeft-(bar.clientWidth-m.offsetWidth)/2,behavior:'smooth'});
  $('mtag').textContent=tagOf(cur);
  $('mname').textContent=o.name;$('mprice').textContent=$('price').textContent;
  $('mcount').textContent=(cur+1)+' / '+OPTS.length;
  if(play&&matchMedia('(max-width:640px)').matches)window.scrollTo({top:0,behavior:'smooth'});
}
// mobile accordion
const acc=$('acc');let openK=-1;
const rows=OPTS.map((o,k)=>{const b=document.createElement('button');b.type='button';b.className='row';
  b.innerHTML='<span class="n">'+num(k)+'</span><span class="t">'+(o.mname||o.name)+(o.fs?'<em>'+o.fs+'</em>':'')+'</span><span class="p">'+priceOf(o)+'</span><span class="ar">▼</span>';
  b.onclick=()=>toggle(k);if(!k||OPTS[k-1].grp!==o.grp){const h=document.createElement('div');h.className='grp';h.textContent=o.grp;acc.appendChild(h);}acc.appendChild(b);return b;});
function closePanel(){const old=acc.querySelector('.panel');if(old)old.remove();rows.forEach(r=>r.classList.remove('on'));openK=-1;}
window.addEventListener('hashchange',()=>{if(location.hash!=='#open'&&openK>=0){closePanel();window.scrollTo({top:0,behavior:'smooth'});}});
function toggle(k){
  if(openK===k){if(location.hash==='#open')history.back();else closePanel();return;}
  const wasOpen=openK>=0;
  closePanel();
  if(!wasOpen&&location.hash!=='#open'){try{location.hash='open'}catch(e){}}
  openK=k;const o=OPTS[k],r=rows[k];r.classList.add('on');
  const p=document.createElement('div');p.className='panel';
  p.innerHTML=(!o.cat&&!o.mp4&&!o.id)?'<p class="pfit">사용 가능 모델 : '+(o.fit||'')+'</p>'+(o.photo?'<img class="mphoto" src="'+o.photo+'" alt="'+o.name+' 사진">':'')+'<p>'+o.desc+'</p>':o.cat?'<p>'+o.desc+'</p><div class="catm">'+o.cat.map((u,i)=>'<span><img src="'+u+'" alt="'+o.name+' '+(i+1)+'쪽" loading="lazy"></span>').join('')+'</div>':o.mp4?(o.fit?'<p class="pfit">사용 가능 모델 : '+o.fit+'</p>':'')+'<div class="pv"'+(o.wide?' style="aspect-ratio:16/9;width:100%"':'')+'><video preload="metadata" src="'+o.mp4+'" poster="'+o.poster+'" controls playsinline autoplay></video></div><p>'+o.desc+'</p><img src="'+o.img+'" alt="'+o.name+' 옵션 사진">':'<div class="pv"><iframe src="https://www.youtube-nocookie.com/embed/'+o.id+'?rel=0&mute=1&playsinline=1&enablejsapi=1&autoplay=1" title="'+o.name+' 동영상" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>'+
    '<p>'+o.desc+'</p><img src="'+o.img+'" alt="'+o.name+' 옵션 사진"><a href="https://www.youtube.com/shorts/'+o.id+'" target="_blank" rel="noopener">영상이 안 보이면 유튜브에서 보기 ›</a>';
  r.after(p);r.scrollIntoView({behavior:'smooth',block:'start'});
}
function ytRate(){document.querySelectorAll('iframe').forEach(f=>{if(f.dataset.r)return;f.dataset.r=1;f.addEventListener('load',()=>{[600,1500,3000].forEach(t=>setTimeout(()=>{try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:'setPlaybackRate',args:[1.5]}),'*')}catch(e){}},t))})})}
new MutationObserver(ytRate).observe(document.body,{childList:true,subtree:true});ytRate();
$('prev').onclick=()=>show(cur-1,true);
$('next').onclick=()=>show(cur+1,true);
$('mprev').onclick=()=>show(cur-1,true);
$('mnext').onclick=()=>show(cur+1,true);
show(0,false);
</script>
